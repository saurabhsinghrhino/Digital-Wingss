<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DigitalWings combines cutting-edge technology, creative design, and strategic marketing to help ambitious businesses build premium digital experiences and accelerate growth."
    />

    <!-- Open Graph Metadata -->
    <meta
      property="og:title"
      content="DigitalWings — Premium IT Services & Digital Agency"
    />
    <meta
      property="og:description"
      content="Build premium websites, mobile applications, Meta ad campaigns, and SEO rankings with DigitalWings."
    />
    <meta property="og:type" content="website" />

    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />

    <title>DigitalWings — Premium IT Services & Digital Agency</title>

    <!-- Theme Flash Prevention Script -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body
    class="bg-white text-slate-900 dark:bg-navy-dark dark:text-slate-100 antialiased selection:bg-sky-100 selection:text-slate-900"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
